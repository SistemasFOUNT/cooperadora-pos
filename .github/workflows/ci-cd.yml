name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cooperadora_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, dom, filter, gd, iconv, json, mbstring, zip
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.testing', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 775 storage bootstrap/cache

    - name: Run Database Migrations
      run: php artisan migrate --force
      env:
        DB_CONNECTION: pgsql
        DB_HOST: localhost
        DB_PORT: 5432
        DB_DATABASE: cooperadora_test
        DB_USERNAME: postgres
        DB_PASSWORD: postgres

    - name: Seed Database
      run: php artisan db:seed --force
      env:
        DB_CONNECTION: pgsql
        DB_HOST: localhost
        DB_PORT: 5432
        DB_DATABASE: cooperadora_test
        DB_USERNAME: postgres
        DB_PASSWORD: postgres

    - name: Run Tests
      run: php artisan test
      env:
        DB_CONNECTION: pgsql
        DB_HOST: localhost
        DB_PORT: 5432
        DB_DATABASE: cooperadora_test
        DB_USERNAME: postgres
        DB_PASSWORD: postgres

    - name: Run Laravel Pint (Code Style)
      run: vendor/bin/pint --test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'

    - name: Install Dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Create deployment package
      run: |
        tar -czf release.tar.gz \
          --exclude=.git \
          --exclude=.github \
          --exclude=node_modules \
          --exclude=.env \
          --exclude=storage/logs \
          --exclude=storage/framework/cache \
          --exclude=storage/framework/sessions \
          --exclude=storage/framework/views \
          --exclude=tests \
          .

    - name: Upload to server
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          cd /var/www

          # Create backup
          if [ -d "cooperadora_backup" ]; then
            rm -rf cooperadora_backup
          fi
          if [ -d "cooperadora" ]; then
            cp -r cooperadora cooperadora_backup
          fi

          # Create temp directory
          mkdir -p cooperadora_temp
          cd cooperadora_temp

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "release.tar.gz"
        target: "/var/www/cooperadora_temp/"

    - name: Deploy application
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          cd /var/www/cooperadora_temp

          # Extract files
          tar -xzf release.tar.gz
          rm release.tar.gz

          # Move to final location
          cd /var/www
          if [ -d "cooperadora" ]; then
            rm -rf cooperadora
          fi
          mv cooperadora_temp cooperadora

          # Set correct permissions (improved)
          cd cooperadora
          chown -R www-data:www-data .
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 644 {} \;
          chmod -R 775 storage bootstrap/cache
          chmod 755 artisan

          # Create necessary directories
          mkdir -p storage/logs
          mkdir -p storage/app
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p bootstrap/cache

          # Ensure correct ownership for created directories
          chown -R www-data:www-data storage bootstrap/cache
          chmod -R 775 storage bootstrap/cache

          # Copy production .env if not exists
          if [ ! -f .env ]; then
            cp .env.production .env
          fi

          # Install production dependencies (no dev packages)
          composer install --no-dev --optimize-autoloader --no-interaction

          # Clear all caches before optimization
          sudo -u www-data php artisan config:clear
          sudo -u www-data php artisan route:clear
          sudo -u www-data php artisan view:clear
          sudo -u www-data php artisan cache:clear

          # Generate app key if needed
          if ! grep -q "APP_KEY=base64:" .env; then
            sudo -u www-data php artisan key:generate
          fi

          # Optimize for production
          sudo -u www-data php artisan config:cache
          sudo -u www-data php artisan route:cache
          sudo -u www-data php artisan view:cache

          # Run migrations safely
          sudo -u www-data php artisan migrate --force

          # Restart services
          systemctl restart apache2

    - name: Copy deployment scripts
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "deployment/post-deploy-check.sh"
        target: "/var/www/cooperadora/"

    - name: Post-deployment verification
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          cd /var/www/cooperadora
          chmod +x deployment/post-deploy-check.sh
          ./deployment/post-deploy-check.sh

    - name: Deployment notification
      if: success()
      run: |
        echo "🎉 Deployment successful!"
        echo "✅ Site: http://cooperadora.odontologia.unt.edu.ar"
        echo "📊 Deploy time: $(date)"
