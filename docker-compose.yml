version: '3.8'

services:
  app:
    build: .
    container_name: cooperadora_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_DATABASE=cooperadora_pos
      - DB_USERNAME=cooperadora_user
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - cooperadora

  nginx:
    image: nginx:alpine
    container_name: cooperadora_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/public
      - ./deployment/docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./deployment/docker/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - cooperadora

  db:
    image: postgres:14
    container_name: cooperadora_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cooperadora_pos
      POSTGRES_USER: cooperadora_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cooperadora

  redis:
    image: redis:alpine
    container_name: cooperadora_redis
    restart: unless-stopped
    networks:
      - cooperadora

volumes:
  postgres_data:

networks:
  cooperadora:
    driver: bridge
